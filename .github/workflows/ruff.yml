name: ruff
permissions:
  contents: read
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
    - develop
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
        with:
          src: >-
            cogs/misc.py
            cogs/quotes.py
            cogs/status.py
            bot.py
            config.py
            database.py